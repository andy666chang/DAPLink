# Debug overlay: printk/log over RTT (via SWD of the HIC itself)
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
# RAM: 19 KB available (cfgram reserved), shrink buffers for RTT/log
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=512
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=16
CONFIG_LOG_BUFFER_SIZE=512
CONFIG_APP_SWO_BUFFER_SIZE=2048
