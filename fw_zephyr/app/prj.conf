# Interface @ 0x0800C000 (if_partition), see standalone.conf
CONFIG_USE_DT_CODE_PARTITION=y

# Driver
CONFIG_GPIO=y
CONFIG_HWINFO=y

# USB device stack (CMSIS-DAP v2 WinUSB + CDC ACM)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_BOS=y
CONFIG_USB_COMPOSITE_DEVICE=y
CONFIG_USB_DEVICE_VID=0x0D28
CONFIG_USB_DEVICE_PID=0x0204
CONFIG_USB_DEVICE_MANUFACTURER="ARM"
CONFIG_USB_DEVICE_PRODUCT="DAPLink CMSIS-DAP"
# 96 bit STM32 UID as hex, see info.c
CONFIG_USB_DEVICE_SN="000000000000000000000000"
CONFIG_USB_MAX_POWER=50
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# USB2UART
CONFIG_APP_USB2UART=y

# Kernel
CONFIG_MAIN_STACK_SIZE=1024

# Console/log is disabled by default: USART1 pins (PA9/PA10) are
# used as LED / SWO on the DAPLink hardware. See debug.conf.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
