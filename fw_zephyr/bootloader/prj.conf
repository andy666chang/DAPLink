# DAPLink bootloader @ 0x08000000 (bl_partition), MAINTENANCE drive

# Image placement
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_FLASH=y
CONFIG_HWINFO=y
CONFIG_GPIO=y
CONFIG_REBOOT=y
CONFIG_POLL=y

# USB device stack (legacy, same as app) + DAPLink MSC class
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_VID=0x0D28
CONFIG_USB_DEVICE_PID=0x0204
CONFIG_USB_DEVICE_MANUFACTURER="ARM"
CONFIG_USB_DEVICE_PRODUCT="DAPLink CMSIS-DAP"
# 96 bit STM32 UID as hex
CONFIG_USB_DEVICE_SN="000000000000000000000000"
CONFIG_USB_MAX_POWER=50
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_WORKQUEUE=n

# Kernel (20 KB RAM, 256 B reserved for cfgram)
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_ISR_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=256

# Console/log is disabled: USART1 pins are used by LED / SWO
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

# Size: bootloader region is 47 KB (DAPLINK_ROM_BL_SIZE)
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_TIMESLICING=n
CONFIG_ERRNO=n
CONFIG_CBPRINTF_NANO=y
CONFIG_THREAD_MONITOR=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_ARM_MPU=n
CONFIG_ASSERT=n
